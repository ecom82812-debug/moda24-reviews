<!DOCTYPE html>
<html lang="uk">
<head>

<title>Відгуки — сторінка товару</title>
<!-- moda24.online: відгуки на сторінці товару — сітка карток «фото + враження».
     Читає готові файли зі сховища review-cache (база на перегляд не навантажується).
     Відгук і фото надсилаються через функцію reviews-api. Фото обов'язкові. -->
<link rel="preconnect" href="https://lvyssuomgbccjmksetof.supabase.co" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.m24r{--ink:#1E1A1B;--soft:#8E8186;--line:#EBEBEA;--tint:#F5F5F4;--acc:#1E1A1B;--hd:'Cormorant Garamond',Georgia,serif;
  font-family:'Manrope',Arial,sans-serif;color:var(--ink);max-width:1160px;margin:0 auto;padding:44px 20px 52px;box-sizing:border-box;-webkit-font-smoothing:antialiased}
.m24r *,.m24r-ov *{box-sizing:border-box}
.m24r [hidden],.m24r-ov [hidden]{display:none!important}
.m24r button,.m24r-ov button{font-family:inherit}
.m24r :focus-visible,.m24r-ov :focus-visible{outline:2px solid #B5B5B3;outline-offset:2px}
.m24r-st{display:inline-flex;gap:1px;color:var(--acc);vertical-align:middle}
.m24r-st svg{width:13px;height:13px;display:block}
.m24r-st .e{color:#DADAD8}

/* шапка: назва і коротке зведення в один рядок */
.m24r-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px 24px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.m24r-title{font-family:var(--hd);font-weight:500;font-size:34px;line-height:1;margin:0;display:flex;align-items:flex-start;gap:6px}
.m24r-title sup{font-family:'Manrope',Arial,sans-serif;font-size:13px;font-weight:600;color:var(--soft);line-height:1;margin-top:4px}
.m24r-sum{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;font-size:13px;color:var(--soft)}
.m24r-sum b{font-size:15px;color:var(--ink);font-weight:700;margin-right:2px}
.m24r-sum .m24r-st svg{width:14px;height:14px}
.m24r-sum span{display:inline-flex;align-items:center;gap:6px}
.m24r-sum em{font-style:normal;margin-left:6px}
.m24r-fitsum{padding:5px 11px;border-radius:999px;background:var(--tint);color:var(--ink);font-size:12px;font-weight:500}
.m24r-add{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border:1px solid var(--ink);border-radius:8px;font-size:14px;font-weight:600;color:var(--ink);transition:background .2s,color .2s}
.m24r-add:hover{background:var(--ink);color:#fff}
.m24r-add svg{width:16px;height:16px}

/* стрічка відгуків: картки з аватаром, текстом, фото, відповіддю магазину і «Відгук корисний?» */
@keyframes m24rIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.m24r-feed{display:grid;gap:12px;margin-top:24px}
.m24r-fc{display:grid;gap:12px;padding:16px;border:1px solid #EBEBEA;border-radius:16px;background:#fff;box-shadow:0 2px 14px rgba(30,26,27,.05);animation:m24rIn .4s ease both;align-content:start;min-width:0;
  grid-template-columns:minmax(0,1fr);grid-template-areas:"h" "t" "p" "r" "ft"}
.m24r-h{grid-area:h;display:flex;align-items:center;gap:10px;min-width:0}
.m24r-ava{width:36px;height:36px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-family:var(--hd);font-size:18px;color:var(--ink);flex:none;text-transform:uppercase}
.m24r-hn{min-width:0;flex:1}
.m24r-hn b{display:block;font-size:14px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m24r-hn small{display:block;font-size:12px;color:var(--soft)}
.m24r-h .m24r-st svg{width:15px;height:15px}
.m24r-t{grid-area:t;display:grid;gap:8px;min-width:0}
.m24r-fit{justify-self:start;font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--ink)}
.m24r-ftx{all:unset;cursor:pointer;font-size:15px;line-height:1.6;color:#3A3235;white-space:pre-line;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.m24r-thumbs{grid-area:p;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.m24r-thumbs::-webkit-scrollbar{display:none}
.m24r-th{all:unset;cursor:pointer;flex:none;width:72px;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--tint)}
.m24r-th img{width:100%;height:100%;object-fit:cover;display:block}
.m24r-rp{grid-area:r;padding:12px 14px;border-radius:12px;background:#F5F5F4;font-size:14px;line-height:1.5;color:#3A3235}
.m24r-rp b{display:block;font-size:12px;font-weight:600;color:var(--soft);margin-bottom:4px}
.m24r-feed.na .m24r-fc{animation:none}
.m24r-ft{grid-area:ft;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--soft)}
.m24r-ft span{margin-right:auto}
.m24r-vote{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 11px;border-radius:10px;background:#F5F5F4;color:var(--ink);font-size:13px;font-weight:600;transition:background .2s,color .2s}
.m24r-vote svg{width:17px;height:17px}
.m24r-vote em{font-style:normal}
.m24r-vote:hover{background:#ECECEA}
.m24r-vote.on{background:var(--acc);color:#fff}
@media (min-width:700px){.m24r-feed{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:981px){
  .m24r-fc{padding:22px 22px 18px}
  .m24r-th{width:84px}
}
.m24r-more{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:center;align-items:center;width:100%;margin-top:28px;height:48px;border-radius:8px;background:var(--tint);font-size:14px;font-weight:600;color:var(--ink)}
.m24r-more:hover{background:#ECECEA}
.m24r-sk{display:block;border-radius:10px;background:linear-gradient(100deg,#F1F1F0 35%,#FAFAF9 50%,#F1F1F0 65%) 0 0/250% 100%;animation:m24rSh 1.3s linear infinite}
.m24r-skg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.m24r-skc{display:grid;gap:9px}.m24r-skc .a{aspect-ratio:3/4}.m24r-skc .b{height:11px;width:60%}.m24r-skc .c{height:11px;width:90%}

/* порожньо */
.m24r-empty{margin-top:24px;display:grid;justify-items:center;gap:10px;padding:36px 20px;border-radius:14px;background:var(--tint);text-align:center}
.m24r-empty svg{width:34px;height:34px;color:var(--acc)}
.m24r-empty b{font-family:var(--hd);font-weight:500;font-size:24px;line-height:1.1}
.m24r-empty p{margin:0;font-size:14px;color:var(--soft);max-width:340px}
.m24r-empty .m24r-add{margin-top:6px;background:var(--ink);color:#fff}
.m24r-retry{all:unset;cursor:pointer;font-size:13px;font-weight:600;border-bottom:1px solid var(--ink)}

@media (min-width:981px){
  .m24r{padding:80px 0 88px}
  .m24r-title{font-size:46px}
  .m24r-feed{margin-top:32px;gap:16px}
  .m24r-more{width:auto;padding:0 40px;margin:36px auto 0}
}

/* вікна: перегляд відгуку і форма */
.m24r-ov{position:fixed;inset:0;z-index:100000;display:none;align-items:flex-end;justify-content:center;background:rgba(24,20,21,.5);font-family:'Manrope',Arial,sans-serif;--ink:#1E1A1B;--soft:#8E8186;--line:#EBEBEA;--tint:#F5F5F4;--acc:#1E1A1B;--hd:'Cormorant Garamond',Georgia,serif;color:var(--ink)}
.m24r-ov.on{display:flex}
.m24r-box{position:relative;background:#fff;width:100%;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;animation:m24rUp .3s cubic-bezier(.2,.8,.2,1)}
@keyframes m24rUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:760px){.m24r-ov{align-items:center;padding:24px}.m24r-box{border-radius:16px;max-width:980px;max-height:88vh}}
.m24r-x{all:unset;cursor:pointer;position:absolute;right:12px;top:12px;z-index:3;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.94);box-shadow:0 2px 10px rgba(0,0,0,.08);color:var(--ink);font-size:15px}

.m24r-view{display:grid}
.m24r-gal{position:relative;background:var(--tint);aspect-ratio:3/4;max-height:62vh;width:100%}
.m24r-gal img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .25s}
.m24r-gal img.ok{opacity:1}
.m24r-dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px}
.m24r-dots b{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55)}
.m24r-dots b.on{background:#fff}
.m24r-nav{all:unset;cursor:pointer;position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:var(--ink)}
.m24r-nav.p{left:12px}.m24r-nav.n{right:12px}
.m24r-nav svg{width:16px;height:16px}
.m24r-vtx{padding:22px 20px 28px;display:grid;gap:12px;align-content:start}
.m24r-vtx .m24r-name{font-size:16px;white-space:normal}
.m24r-vtx p{margin:0;font-size:15px;line-height:1.65;color:#3A3235;white-space:pre-line;overflow-wrap:anywhere}
.m24r-tags{display:flex;flex-wrap:wrap;gap:6px}
.m24r-tags span{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--tint);color:var(--ink)}
.m24r-reply{padding:14px 16px;border-radius:10px;background:var(--tint);font-size:14px;line-height:1.55}
.m24r-reply b{display:block;font-size:12px;color:var(--acc);margin-bottom:4px}
@media (min-width:760px){
  .m24r-view{grid-template-columns:1.1fr 1fr}
  .m24r-gal{max-height:88vh;height:100%;aspect-ratio:auto;min-height:520px}
  .m24r-vtx{padding:48px 36px 36px;max-height:88vh;overflow:auto}
}

/* форма */
.m24r-form{padding:26px 20px 28px;display:grid;gap:20px}
@media (min-width:760px){.m24r-vw .m24r-box:has(.nop){max-width:560px}.m24r-sh .m24r-box{max-width:560px}.m24r-form{padding:34px 34px 30px}}
.m24r-fh h3{font-family:var(--hd);font-weight:500;font-size:30px;line-height:1.05;margin:0 40px 4px 0}
.m24r-fh p{margin:0;font-size:13px;color:var(--soft)}
.m24r-f{display:grid;gap:8px;font-size:13px;font-weight:600}
.m24r-f small{font-weight:400;color:var(--soft)}
.m24r-f input,.m24r-f textarea{font:inherit;font-size:16px;font-weight:400;color:var(--ink);border:1px solid #D9D9D7;border-radius:8px;padding:12px 14px;background:#fff;width:100%;outline:none;transition:border-color .2s}
.m24r-f input:focus,.m24r-f textarea:focus{border-color:var(--ink)}
.m24r-f textarea{min-height:110px;resize:vertical}
.m24r-f.err input,.m24r-f.err textarea,.m24r-f.err .m24r-tile.add{border-color:#C0392B}
.m24r-f.err .m24r-rate{color:#C0392B}
.m24r-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.m24r-tile{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:var(--tint)}
.m24r-tile img{width:100%;height:100%;object-fit:cover}
.m24r-tile button{all:unset;cursor:pointer;position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:11px;display:grid;place-items:center}
.m24r-tile.add{display:grid;place-items:center;align-content:center;gap:4px;border:1px dashed #C8C8C6;background:#fff;cursor:pointer;font-size:12px;font-weight:600;text-align:center;color:var(--ink)}
.m24r-tile.add svg{width:22px;height:22px;color:var(--acc)}
.m24r-tile.add input{display:none}
.m24r-rate{display:flex;align-items:center;gap:4px;color:#DADAD8}
.m24r-rate button{all:unset;cursor:pointer;color:inherit}
.m24r-rate button.on{color:var(--acc)}
.m24r-rate svg{width:34px;height:34px;display:block}
.m24r-rate em{font-style:normal;font-size:13px;font-weight:500;color:var(--soft);margin-left:8px}
.m24r-seg{display:flex;flex-wrap:wrap;gap:6px}
.m24r-seg button{all:unset;cursor:pointer;padding:9px 14px;border:1px solid #D9D9D7;border-radius:999px;font-size:13px;font-weight:500}
.m24r-seg button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.m24r-send{all:unset;cursor:pointer;text-align:center;height:52px;line-height:52px;border-radius:8px;background:var(--ink);color:#fff;font-size:15px;font-weight:600}
.m24r-send[disabled]{opacity:.5;cursor:default}
.m24r-note{font-size:13px;text-align:center;min-height:18px;margin-top:-8px}
.m24r-note.ok{color:#2F6B45}.m24r-note.err{color:#C0392B}
.m24r-done{display:grid;justify-items:center;gap:10px;text-align:center;padding:30px 10px 10px}
.m24r-done svg{width:44px;height:44px;color:var(--acc)}
.m24r-done b{font-family:var(--hd);font-weight:500;font-size:28px}
.m24r-done p{margin:0;font-size:14px;color:var(--soft)}
.m24r-hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;opacity:0}
@media (prefers-reduced-motion:reduce){.m24r *,.m24r-ov *{animation:none!important;transition:none!important}}
</style>
</head>

  function fail() {
    if (all.length) return;
    $('.m24r-body').innerHTML = '<div class="m24r-empty"><p>Відгуки тимчасово не завантажились.</p><button type="button" class="m24r-retry">Спробувати ще</button></div>';
  }
  function load() {
    var key = 'm24r:p:' + UID, c = lsGet(key);
    if (c && c.items) { ver = c.v; apply(c.items); }
    return fetchT(SNAP + 'ratings.json?t=' + Math.floor(Date.now() / 60000)).then(function (d) {
      var x = d && d.r && d.r[UID];
      if (!x || !x[1]) { lsSet(key, { v: 'none', items: [] }); ver = 'none'; return apply([]); }
      if (x[2] === ver) return;
      return fetchT(SNAP + 'p/' + UID + '.json?v=' + x[2]).then(function (p) {
        ver = x[2]; var items = p.items || [];
        if (JSON.stringify(items).length < 400000) lsSet(key, { v: ver, items: items });
        apply(items);
      });
    }).catch(fail);
  }

  function render() {
    var n = all.length;
    $('.m24r-n').textContent = n ? n : '';
    $('[data-add]').hidden = !n;
    if (!n) {
      $('.m24r-sum').hidden = true;
      $('.m24r-body').innerHTML = '<div class="m24r-empty">' + CAM + '<b>Відгуків поки немає</b><p>Поділіться враженням і фото — це допоможе іншим обрати розмір.</p><button type="button" class="m24r-add" data-add>Написати відгук</button></div>';
      return;
    }
    var sum = 0, fit = { small: 0, 'true': 0, large: 0 }, fn = 0;
    all.forEach(function (r) { sum += +r.rating || 0; if (fit.hasOwnProperty(r.size_fit)) { fit[r.size_fit]++; fn++; } });
    var avg = sum / n, s = '<span><b>' + avg.toFixed(1).replace('.', ',') + '</b>' + stars(Math.round(avg)) + '<em>' + n + ' ' + plural(n, 'відгук', 'відгуки', 'відгуків') + '</em></span>';
    if (fn) {
      var top = ['true', 'small', 'large'].sort(function (a, b) { return fit[b] - fit[a]; })[0];
      s += '<span class="m24r-fitsum">' + FIT[top] + ' — ' + Math.round(fit[top] / fn * 100) + '% покупців</span>';
    }
    $('.m24r-sum').innerHTML = s; $('.m24r-sum').hidden = false;
    var list = all.slice(0, shown);
    // плавна поява — лише вперше; оновлення (голос, свіжі дані) без мерехтіння
    var html = '<div class="m24r-feed' + (drawn ? ' na' : '') + '">' + list.map(function (r, i) {
      var name = (r.author_name || '').trim() || 'Покупець', my = votes[r.id] || 0;
      var up = (r.up || 0), dn = (r.down || 0);
      return '<article class="m24r-fc" style="animation-delay:' + Math.min(i, 8) * 40 + 'ms">' +
        '<div class="m24r-h"><span class="m24r-ava">' + esc(name.charAt(0)) + '</span><span class="m24r-hn"><b>' + esc(name) + '</b><small>' + fmtD(r.created_at) + '</small></span>' + stars(+r.rating || 0) + '</div>' +
        '<div class="m24r-t">' + (r.size_fit && FIT[r.size_fit] ? '<span class="m24r-fit">' + FIT[r.size_fit] + '</span>' : '') + '<button type="button" class="m24r-ftx" data-i="' + i + '">' + esc(r.body) + '</button></div>' +
        (r._p.length ? '<div class="m24r-thumbs">' + r._p.map(function (u, k) { return '<button type="button" class="m24r-th" data-i="' + i + '" data-k="' + k + '" aria-label="Фото ' + (k + 1) + '">' + img(small(u), u) + '</button>'; }).join('') + '</div>' : '') +
        (r.reply_text ? '<div class="m24r-rp"><b>Відповідь Moda24</b>' + esc(r.reply_text) + '</div>' : '') +
        '<div class="m24r-ft"><span>Відгук корисний?</span>' +
          '<button type="button" class="m24r-vote' + (my === 1 ? ' on' : '') + '" data-vote="1" data-id="' + r.id + '" aria-label="Так, корисний">' + THUMB + (up ? '<em>' + up + '</em>' : '') + '</button>' +
          '<button type="button" class="m24r-vote' + (my === -1 ? ' on' : '') + '" data-vote="-1" data-id="' + r.id + '" aria-label="Ні">' + THUMB_D + (dn ? '<em>' + dn + '</em>' : '') + '</button></div>' +
        '</article>';
    }).join('') + '</div>';
    var rest = n - shown;
    if (rest > 0) html += '<button type="button" class="m24r-more">' + (rest <= perPage() ? 'Показати ще ' + rest + ' ' + plural(rest, 'відгук', 'відгуки', 'відгуків') : 'Показати ще · залишилось ' + rest) + '</button>';
    $('.m24r-body').innerHTML = html;
    drawn = true;
  }

  /* ---------- перегляд відгуку ---------- */
  var vw = document.createElement('div');
  vw.className = 'm24r-ov m24r-vw'; vw.setAttribute('role', 'dialog'); vw.setAttribute('aria-modal', 'true'); vw.setAttribute('aria-label', 'Відгук');
  vw.innerHTML = '<div class="m24r-box"><button type="button" class="m24r-x" aria-label="Закрити">✕</button><div class="m24r-view"><div class="m24r-gal"><img alt=""><button type="button" class="m24r-nav p" aria-label="Попереднє фото">' + ARR_L + '</button><button type="button" class="m24r-nav n" aria-label="Наступне фото">' + ARR_R + '</button><div class="m24r-dots"></div></div><div class="m24r-vtx"></div></div></div>';
  document.body.appendChild(vw);
  var cr = null, ci = 0, tx = null, seq = 0;
  function photo(i) {
    var p = cr._p; if (!p.length) return;
    ci = (i + p.length) % p.length;
    var im = vw.querySelector('.m24r-gal img'), u = p[ci], my = ++seq;
    im.classList.remove('ok'); im.onload = function () { if (my === seq) im.classList.add('ok'); };
    im.onerror = function () { if (my === seq && im.src !== u) im.src = u; };
    im.src = med(u);
    vw.querySelector('.m24r-dots').innerHTML = p.length > 1 ? p.map(function (_, k) { return '<b' + (k === ci ? ' class="on"' : '') + '></b>'; }).join('') : '';
    vw.querySelectorAll('.m24r-nav').forEach(function (b) { b.hidden = p.length < 2; });
  }
  function openView(r, k) {
    cr = r; var name = (r.author_name || '').trim() || 'Покупець';
    vw.querySelector('.m24r-vtx').innerHTML = stars(+r.rating || 0) + '<div><div class="m24r-name">' + esc(name) + '</div><small style="font-size:12px;color:var(--soft)">' + fmtD(r.created_at) + '</small></div>' +
      ((r.size_fit && FIT[r.size_fit]) || r.verified ? '<div class="m24r-tags">' + (r.size_fit && FIT[r.size_fit] ? '<span>' + FIT[r.size_fit] + '</span>' : '') + (r.verified ? '<span>✓ Покупка підтверджена</span>' : '') + '</div>' : '') +
      (r.title ? '<p style="font-weight:600">' + esc(r.title) + '</p>' : '') + '<p>' + esc(r.body) + '</p>' +
      (r.reply_text ? '<div class="m24r-reply"><b>Відповідь Moda24</b>' + esc(r.reply_text) + '</div>' : '');
    vw.querySelector('.m24r-view').classList.toggle('nop', !r._p.length);
    photo(k || 0);
    vw.classList.add('on'); document.documentElement.style.overflow = 'hidden'; vw.querySelector('.m24r-x').focus();
  }
  function closeAll() { vw.classList.remove('on'); sh.classList.remove('on'); document.documentElement.style.overflow = ''; }
  vw.addEventListener('click', function (e) {
    if (e.target === vw || e.target.closest('.m24r-x')) return closeAll();
    if (e.target.closest('.m24r-nav.p')) photo(ci - 1);
    else if (e.target.closest('.m24r-nav.n')) photo(ci + 1);
  });
  var gal = vw.querySelector('.m24r-gal');
  gal.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  gal.addEventListener('touchend', function (e) { if (tx === null) return; var dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 40) photo(ci + (dx < 0 ? 1 : -1)); }, { passive: true });

  /* ---------- стискання фото в браузері ---------- */
  function shrink(bmp, w, h, q) {
    var W, Hh; if (h) { W = w; Hh = h; } else { W = Math.min(w, bmp.width); Hh = Math.round(bmp.height * W / bmp.width); }
    var c = document.createElement('canvas'); c.width = W; c.height = Hh; var x = c.getContext('2d');
    if (h) { var s = Math.max(W / bmp.width, Hh / bmp.height), dw = bmp.width * s, dh = bmp.height * s; x.drawImage(bmp, (W - dw) / 2, (Hh - dh) / 2, dw, dh); }
    else x.drawImage(bmp, 0, 0, W, Hh);
    return new Promise(function (ok) { c.toBlob(function (b) {
      if (b && b.type === 'image/webp') return ok(b);
      c.toBlob(function (j) { ok(j); }, 'image/jpeg', q);   // браузери без webp — jpeg
    }, 'image/webp', q); });
  }
  /* одне фото → три копії: основна (1600), для перегляду (1080), мініатюра (240×320) */
  function prepare(file) {
    if (!window.createImageBitmap) return Promise.reject(new Error('decode'));
    return createImageBitmap(file).then(function (bmp) {
      return Promise.all([shrink(bmp, 1600, 0, .85), shrink(bmp, 1080, 0, .8), shrink(bmp, 240, 320, .72)]);
    }, function () { throw new Error('decode'); });
  }
  function sendPhoto(id, k, file) {
    return prepare(file).then(function (b) {
      var ext = b[0].type === 'image/webp' ? 'webp' : 'jpg';
      var fd = new FormData();
      fd.append('full', b[0], 'photo.' + ext); fd.append('mid', b[1], 'mid.' + ext); fd.append('thumb', b[2], 'thumb.' + ext);
      return fetchT(API + '?a=photo&id=' + id + '&k=' + k, { method: 'POST', body: fd }, 30000);
    });
  }

  /* ---------- форма: фото першим кроком, бо без фото відгук не приймається ---------- */
  var nameEl = document.querySelector('h1.js-catalog-prod-name, .js-product-name, .js-store-prod-name');
  var PNAME = nameEl ? nameEl.textContent.trim() : '';
  var sh = document.createElement('div');
  sh.className = 'm24r-ov m24r-sh'; sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-modal', 'true'); sh.setAttribute('aria-label', 'Написати відгук');
  sh.innerHTML = '<div class="m24r-box"><button type="button" class="m24r-x" aria-label="Закрити">✕</button><form class="m24r-form" novalidate>' +
    '<div class="m24r-fh"><h3>Ваш відгук</h3>' + (PNAME ? '<p>' + esc(PNAME) + '</p>' : '') + '</div>' +
    '<div class="m24r-f" data-k="ph">Фото у виробі * <small>від 1 до ' + MAX_PHOTOS + '</small><div class="m24r-tiles"></div></div>' +
    '<div class="m24r-f" data-k="rate">Оцінка *<span class="m24r-rate">' + [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-r="' + n + '" aria-label="' + n + ' з 5">' + STAR + '</button>'; }).join('') + '<em></em></span></div>' +
    '<div class="m24r-f">Як сів розмір?<span class="m24r-seg"><button type="button" data-v="small">Маломірить</button><button type="button" data-v="true">Відповідає</button><button type="button" data-v="large">Великомірить</button></span></div>' +
    '<label class="m24r-f" data-k="b">Враження *<textarea name="b" maxlength="1400" placeholder="Тканина, посадка, як виглядає на вас"></textarea></label>' +
    '<label class="m24r-f" data-k="n">Ім\'я *<input type="text" name="n" maxlength="60" autocomplete="given-name"></label>' +
    '<input type="text" name="hp" class="m24r-hp" tabindex="-1" autocomplete="off" aria-hidden="true">' +
    '<button type="submit" class="m24r-send">Надіслати відгук</button><div class="m24r-note" aria-live="polite"></div></form></div>';
  document.body.appendChild(sh);
  var form = sh.querySelector('form'), formHtml = form.innerHTML, rating = 0, fit = '', files = [], opened = 0;
  function bindForm() {
    form = sh.querySelector('form');
    form.n.addEventListener('input', function () { mark('n', false); });
    form.b.addEventListener('input', function () { mark('b', false); });
    tiles();
  }
  function shOpen() {
    if (!sh.querySelector('form.m24r-form textarea')) { sh.querySelector('.m24r-box').innerHTML = '<button type="button" class="m24r-x" aria-label="Закрити">✕</button><form class="m24r-form" novalidate>' + formHtml + '</form>'; rating = 0; fit = ''; files = []; bindForm(); }
    sh.classList.add('on'); document.documentElement.style.overflow = 'hidden'; if (!opened) opened = Date.now();
  }
  function note(t, c) { var n = sh.querySelector('.m24r-note'); n.textContent = t; n.className = 'm24r-note ' + (c || ''); }
  function mark(k, on) { var f = sh.querySelector('[data-k="' + k + '"]'); if (f) f.classList.toggle('err', on); }
  function tiles() {
    var h = files.map(function (f, i) { return '<div class="m24r-tile"><img src="' + URL.createObjectURL(f) + '" alt=""><button type="button" data-rm="' + i + '" aria-label="Прибрати фото">✕</button></div>'; }).join('');
    if (files.length < MAX_PHOTOS) h += '<label class="m24r-tile add">' + CAM + 'Додати<input type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple></label>';
    sh.querySelector('.m24r-tiles').innerHTML = h;
    var inp = sh.querySelector('.m24r-tile.add input');
    if (inp) inp.addEventListener('change', function (e) { files = files.concat(Array.prototype.slice.call(e.target.files, 0, MAX_PHOTOS - files.length)); tiles(); });
    if (files.length) mark('ph', false);
  }
  bindForm();
  sh.addEventListener('click', function (e) {
    var t = e.target;
    if (t === sh || t.closest('.m24r-x')) return closeAll();
    var rb = t.closest('.m24r-rate button'); if (rb) { rating = +rb.getAttribute('data-r'); mark('rate', false); sh.querySelectorAll('.m24r-rate button').forEach(function (b) { b.classList.toggle('on', +b.getAttribute('data-r') <= rating); }); sh.querySelector('.m24r-rate em').textContent = RATE_TXT[rating]; return; }
    var sb = t.closest('.m24r-seg button'); if (sb) { fit = fit === sb.getAttribute('data-v') ? '' : sb.getAttribute('data-v'); sh.querySelectorAll('.m24r-seg button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-v') === fit); }); return; }
    var rm = t.closest('[data-rm]'); if (rm) { e.preventDefault(); files.splice(+rm.getAttribute('data-rm'), 1); tiles(); }
  });
  sh.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = form.n.value.trim(), body = form.b.value.trim();
    mark('ph', !files.length); mark('rate', !rating); mark('b', !body); mark('n', !name);
    if (!files.length) return note('Додайте хоча б одне фото', 'err');
    if (!rating) return note('Оберіть оцінку', 'err');
    if (!body) return note('Напишіть кілька слів про товар', 'err');
    if (!name) return note('Вкажіть ім\'я', 'err');
    var btn = sh.querySelector('.m24r-send'); btn.disabled = true; btn.textContent = 'Надсилаємо…'; note('');
    var sent = 0, failed = 0;
    // спершу перевіряємо, що фото відкриваються (HEIC на старих телефонах — ні), і лише тоді надсилаємо відгук
    Promise.all(files.map(function (f) { return prepare(f).then(function () { return true; }, function () { return false; }); })).then(function (ok) {
      if (ok.indexOf(false) !== -1) throw new Error('decode');
      return fetchT(API + '?a=submit', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({
        product_id: PID, product_url: PID, product_name: PNAME || null,
        author_name: name, rating: rating, body: body, size_fit: fit || null,
        hp: form.hp.value, t: opened ? Date.now() - opened : null
      }) }, 20000);
    }).then(function (rev) {
      if (!rev || !rev.id) return;
      btn.textContent = 'Завантажуємо фото…';
      return files.reduce(function (p, f) {
        return p.then(function () { return sendPhoto(rev.id, rev.k, f).then(function () { sent++; }, function () { failed++; }); });
      }, Promise.resolve());
    }).then(function () {
      if (failed && !sent) { note('Фото не завантажились. Спробуйте ще раз або оберіть інші фото.', 'err'); return; }
      form.innerHTML = '<div class="m24r-done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></svg><b>Дякуємо!</b><p>Відгук з\'явиться на сайті після перевірки.</p></div>';
    }).catch(function (e) {
      if (e && e.message === 'decode') { mark('ph', true); return note('Одне з фото не вдалося відкрити. Оберіть фото у форматі JPG або PNG.', 'err'); }
      note(e && e.status === 429 ? 'Забагато відгуків за короткий час. Спробуйте пізніше.' : 'Не вдалося надіслати. Спробуйте ще раз за хвилину.', 'err');
    }).then(function () { var b = sh.querySelector('.m24r-send'); if (b) { b.disabled = false; b.textContent = 'Надіслати відгук'; } });
  });

  /* ---------- «Відгук корисний?» ---------- */
  function vote(btn) {
    var id = btn.getAttribute('data-id'), v = +btn.getAttribute('data-vote'), r = null;
    all.forEach(function (x) { if (x.id === id) r = x; });
    if (!r) return;
    var prev = votes[id] || 0, next = prev === v ? 0 : v;
    // одразу показуємо результат, сервер підтверджує; список не перебудовуємо — фото не перезавантажуються
    if (prev === 1) r.up = Math.max(0, (r.up || 0) - 1); if (prev === -1) r.down = Math.max(0, (r.down || 0) - 1);
    if (next === 1) r.up = (r.up || 0) + 1; if (next === -1) r.down = (r.down || 0) + 1;
    if (next) votes[id] = next; else delete votes[id];
    try { localStorage.setItem('m24r:votes', JSON.stringify(votes)); } catch (e) {}
    paintVote(r);
    fetchT(API + '?a=vote', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ id: id, v: next }) }, 10000)
      .then(function (d) { if (d && d.ok) { r.up = d.up; r.down = d.down; paintVote(r); } })
      .catch(function () {});
  }
  function paintVote(r) {
    var my = votes[r.id] || 0;
    root.querySelectorAll('.m24r-vote[data-id="' + r.id + '"]').forEach(function (b) {
      var v = +b.getAttribute('data-vote'), n = v === 1 ? (r.up || 0) : (r.down || 0);
      b.classList.toggle('on', my === v);
      var em = b.querySelector('em');
      if (n) { if (!em) { em = document.createElement('em'); b.appendChild(em); } em.textContent = n; }
      else if (em) em.remove();
    });
  }

  /* ---------- події ---------- */
  root.addEventListener('click', function (e) {
    var t = e.target;
    var vb = t.closest('.m24r-vote'); if (vb) return vote(vb);
    var th = t.closest('.m24r-th'); if (th) return openView(all[+th.getAttribute('data-i')], +th.getAttribute('data-k'));
    var c = t.closest('.m24r-ftx'); if (c) return openView(all[+c.getAttribute('data-i')], 0);
    if (t.closest('.m24r-more')) { shown += perPage(); return render(); }
    if (t.closest('[data-add]')) return shOpen();
    if (t.closest('.m24r-retry')) { $('.m24r-body').innerHTML = ''; return load(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeAll();
    if (vw.classList.contains('on')) { if (e.key === 'ArrowRight') photo(ci + 1); if (e.key === 'ArrowLeft') photo(ci - 1); }
  });
  // рядок з оцінкою під назвою товару (reviews-catalog.js) веде сюди
  window.m24ReviewsOpen = function () { root.scrollIntoView({ behavior: 'smooth', block: 'start' }); };

  /* дані вантажимо, коли блок наближається до екрана */
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) { if (es.some(function (x) { return x.isIntersecting; })) { io.disconnect(); load(); } }, { rootMargin: '600px 0px' });
    io.observe(root);
  } else load();
})();
</script>
</body>
</html>
