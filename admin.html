<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moda24 · Відгуки</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Адмінка відгуків moda24.online: усе керування — прямо на картці відгуку */
:root{--ink:#1E1A1B;--soft:#86868A;--line:#E8E8E6;--tint:#F5F5F4;--bg:#F7F7F6;--ok:#2F6B45;--okbg:#E9F3EC;--wait:#8A5A00;--waitbg:#FBF1DD;--err:#C0392B;--hd:'Cormorant Garamond',Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font:400 14px/1.5 'Manrope',Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
a{color:inherit}

/* вхід */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 24px;display:grid;gap:14px}
.lbox h1{font:500 32px/1.05 var(--hd);margin:0 0 6px}
.lbox label{display:grid;gap:6px;font-size:13px;font-weight:600}
.in{width:100%;height:44px;padding:0 12px;border:1px solid #D9D9D7;border-radius:10px;background:#fff;outline:none}
.in:focus{border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#CFCFCC}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#3A3235}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--err)}
.btn.big{height:46px}
.link{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:13px;justify-self:center}
.msg{min-height:18px;font-size:13px;text-align:center;color:var(--err)}

/* шапка */
.top{position:sticky;top:0;z-index:5;background:rgba(247,247,246,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{font:500 24px/1 var(--hd);margin-right:auto}
.bar{max-width:1100px;margin:0 auto;padding:10px 16px 12px;display:grid;gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600}
.tab b{font-weight:700;margin-left:4px;opacity:.55}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.on b{opacity:.8}

/* список */
.list{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px}
.card.wait{border-color:#EED9AE}
.c-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.wait{background:var(--waitbg);color:var(--wait)}
.prod{display:inline-flex;align-items:center;gap:6px;font-weight:600;text-decoration:none;min-width:0}
.prod span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.prod:hover span{text-decoration:underline}
.prod svg{width:14px;height:14px;flex:none;color:var(--soft)}
.uid{font-size:12px;color:var(--soft)}
.c-grid{display:grid;gap:12px}
.who{display:grid;gap:10px}
.f{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--soft)}
.f .in{height:40px;font-size:14px;font-weight:500;color:var(--ink)}
.f select.in{padding-right:8px}
.row2{display:grid;gap:10px}
.phone{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;background:var(--tint);font-size:14px;font-weight:600;color:var(--ink)}
.phone a{text-decoration:none}
.phone.none{font-weight:500;color:var(--soft)}
.phone button{margin-left:auto;border:0;background:none;font-size:12px;color:var(--soft);text-decoration:underline}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;padding:2px;color:#D6D6D3}
.stars button.on{color:var(--ink)}
.stars svg{width:24px;height:24px;display:block}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink)}
.chk input{width:18px;height:18px;accent-color:var(--ink)}
.ta{width:100%;min-height:90px;padding:10px 12px;border:1px solid #D9D9D7;border-radius:10px;background:#fff;outline:none;resize:vertical;font-size:14px;line-height:1.55}
.ta:focus{border-color:var(--ink)}
.ta.reply{min-height:64px;background:var(--tint);border-color:transparent}
.ta.reply:focus{background:#fff;border-color:var(--ink)}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:76px;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--tint)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;display:grid;place-items:center}
.nophoto{font-size:13px;color:var(--wait);background:var(--waitbg);padding:8px 12px;border-radius:10px}
.c-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.c-foot .meta{margin-right:auto;font-size:12px;color:var(--soft)}
.saved{font-size:12px;color:var(--ok);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
.empty{padding:60px 16px;text-align:center;color:var(--soft)}
.more{justify-self:center}
@media (min-width:860px){
  .c-grid{grid-template-columns:280px minmax(0,1fr);gap:20px}
  .card{padding:20px 22px}
  .prod span{max-width:520px}
}

/* перегляд фото */
.lb{position:fixed;inset:0;z-index:20;background:rgba(18,15,16,.92);display:grid;place-items:center;padding:20px}
.lb img{max-width:100%;max-height:90vh;border-radius:6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;max-width:90vw}
.toast.err{background:var(--err)}
</style>
</head>
<body>

<!-- вхід -->
<div class="login" id="login" hidden>
  <div class="lbox" id="lbox">
    <h1>Moda24 · Відгуки</h1>
    <label>Email<input class="in" type="email" id="email" autocomplete="username"></label>
    <label>Пароль<input class="in" type="password" id="pwd" autocomplete="current-password"></label>
    <button class="btn dark big" id="btn-login">Увійти</button>
    <button class="link" id="btn-forgot">Забули пароль?</button>
    <div class="msg" id="lmsg"></div>
  </div>
  <div class="lbox" id="pbox" hidden>
    <h1>Новий пароль</h1>
    <label>Пароль (мінімум 10 символів)<input class="in" type="password" id="np1" autocomplete="new-password"></label>
    <label>Повторіть пароль<input class="in" type="password" id="np2" autocomplete="new-password"></label>
    <button class="btn dark big" id="btn-np">Зберегти й увійти</button>
    <div class="msg" id="pmsg"></div>
  </div>
</div>

<!-- адмінка -->
<div id="app" hidden>
  <div class="top">
    <div class="top-in">
      <div class="logo">Moda24 · Відгуки</div>
      <button class="btn ghost" id="btn-pass">Пароль</button>
      <button class="btn" id="btn-out">Вийти</button>
    </div>
    <div class="bar">
      <div class="tabs">
        <button class="tab on" data-tab="wait">На перевірці<b id="n-wait"></b></button>
        <button class="tab" data-tab="ok">Опубліковані<b id="n-ok"></b></button>
        <button class="tab" data-tab="all">Усі<b id="n-all"></b></button>
      </div>
      <input class="in" type="search" id="q" placeholder="Пошук: ім'я, текст, товар">
    </div>
  </div>
  <div class="list" id="list"></div>
</div>

<script>
/* ===== НАЛАШТУВАННЯ =====
   Публічний ключ тут безпечний: без входу адміністратора база нічого не віддає і не змінює (RLS). */
const SB_URL = 'https://lvyssuomgbccjmksetof.supabase.co';
const SB_PUB = 'sb_publishable_dtLu2_5BPLRRjRnPKqOd7g_uM_DoE2S';
const BUCKET = 'review-photos';
const PAGE = 20;
/* ======================== */

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const FIT = { small: 'Сидить тісніше', 'true': 'Саме в розмір', large: 'Сидить вільніше' };
const STAR = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.8c.4 0 .7.2.9.6l2.3 4.7 5.2.8c.8.1 1.1 1.1.5 1.7l-3.8 3.7.9 5.2c.1.8-.7 1.4-1.4 1L12 18l-4.6 2.5c-.7.4-1.6-.2-1.4-1l.9-5.2-3.8-3.7c-.6-.6-.3-1.6.5-1.7l5.2-.8 2.3-4.7c.2-.4.5-.6.9-.6z"/></svg>';
const EXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>';

function toast(t, err) {
  const el = document.createElement('div'); el.className = 'toast' + (err ? ' err' : ''); el.textContent = t;
  document.body.appendChild(el); setTimeout(() => el.remove(), err ? 4500 : 2200);
}

/* ===== вхід (Supabase Auth: email + пароль) ===== */
let session = null;
try { session = JSON.parse(sessionStorage.getItem('adm_session') || 'null'); } catch {}
const clean = v => String(v || '').replace(/[^\x21-\x7E]/g, '');   // невидимі символи з токена (посилання, скопійоване з чату)
function saveSession(d) {
  session = { access: clean(d.access_token), refresh: clean(d.refresh_token), exp: Date.now() + ((+d.expires_in || 3600) - 60) * 1000 };
  sessionStorage.setItem('adm_session', JSON.stringify(session));
}
async function auth(grant, body) {
  const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=${grant}`, { method: 'POST', headers: { apikey: SB_PUB, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error_description || d.msg || 'Помилка входу');
  saveSession(d);
}
async function token() {
  if (!session) throw new Error('Не виконано вхід');
  if (Date.now() > session.exp) {
    try { await auth('refresh_token', { refresh_token: session.refresh }); }
    catch { logout(); throw new Error('Сесія завершилась'); }
  }
  return session.access;
}
async function H(extra = {}) { return { apikey: SB_PUB, Authorization: 'Bearer ' + await token(), ...extra }; }
async function api(path, opt = {}) {
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, { ...opt, headers: await H(opt.headers || {}) });
  if (!r.ok) { const t = await r.text(); let m = t; try { m = JSON.parse(t).message || t; } catch {} throw new Error(m); }
  return r;
}
const patch = (path, body) => api(path, { method: 'PATCH', headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify(body) });
const del = path => api(path, { method: 'DELETE', headers: { Prefer: 'return=minimal' } });
async function isAdmin() { const r = await api('rpc/is_admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }); return (await r.json()) === true; }
function logout() {
  if (session) fetch(`${SB_URL}/auth/v1/logout`, { method: 'POST', headers: { apikey: SB_PUB, Authorization: 'Bearer ' + session.access } }).catch(() => {});
  sessionStorage.removeItem('adm_session'); sessionStorage.removeItem('adm_recovery'); location.reload();
}

$('#btn-login').onclick = async () => {
  const m = $('#lmsg'); m.style.color = ''; m.textContent = '';
  try {
    await auth('password', { email: $('#email').value.trim(), password: $('#pwd').value });
    if (!await isAdmin()) { sessionStorage.removeItem('adm_session'); session = null; throw new Error('Немає прав адміністратора'); }
    start();
  } catch (e) { m.textContent = e.message === 'Invalid login credentials' ? 'Невірний email або пароль' : e.message; $('#pwd').value = ''; }
};
$('#pwd').onkeydown = e => { if (e.key === 'Enter') $('#btn-login').click(); };
/* «Забули пароль?»: лист Supabase з посиланням назад на цю сторінку */
$('#btn-forgot').onclick = async () => {
  const email = $('#email').value.trim(), m = $('#lmsg');
  if (!email) { m.style.color = ''; m.textContent = 'Впишіть email і натисніть ще раз'; return; }
  const r = await fetch(`${SB_URL}/auth/v1/recover?redirect_to=${encodeURIComponent(location.origin + location.pathname)}`, {
    method: 'POST', headers: { apikey: SB_PUB, 'Content-Type': 'application/json' }, body: JSON.stringify({ email })
  }).catch(() => null);
  m.style.color = r && r.ok ? 'var(--ink)' : '';
  m.textContent = r && r.ok ? 'Лист надіслано. Відкрийте посилання з листа на цьому ж пристрої.'
    : r && r.status === 429 ? 'Забагато листів за годину. Спробуйте трохи пізніше.' : 'Не вдалося надіслати лист. Спробуйте ще раз.';
};
/* перехід з листа відновлення: просимо задати новий пароль */
(function () {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('access_token') && h.get('type') === 'recovery') {
    saveSession({ access_token: h.get('access_token'), refresh_token: h.get('refresh_token'), expires_in: h.get('expires_in') });
    sessionStorage.setItem('adm_recovery', '1');
    history.replaceState(null, '', location.pathname);
  } else if (h.get('error_description')) {
    history.replaceState(null, '', location.pathname);
    $('#lmsg').textContent = 'Посилання з листа застаріло. Натисніть «Забули пароль?» ще раз.';
  }
})();
async function setPassword(p1, p2, msgEl) {
  if (p1.length < 10) throw new Error('Пароль має бути не коротший за 10 символів');
  if (p1 !== p2) throw new Error('Паролі не збігаються');
  const r = await fetch(`${SB_URL}/auth/v1/user`, { method: 'PUT', headers: await H({ 'Content-Type': 'application/json' }), body: JSON.stringify({ password: p1 }) });
  if (!r.ok) throw new Error((await r.json()).msg || 'Не вдалося зберегти пароль');
}
$('#btn-np').onclick = async () => {
  try {
    await setPassword($('#np1').value, $('#np2').value);
    if (!await isAdmin()) throw new Error('Немає прав адміністратора');
    sessionStorage.removeItem('adm_recovery'); start();
  } catch (e) { $('#pmsg').textContent = e.message; }
};
$('#btn-pass').onclick = async () => {
  const p1 = prompt('Новий пароль (мінімум 10 символів):'); if (!p1) return;
  const p2 = prompt('Повторіть новий пароль:');
  try { await setPassword(p1, p2 || ''); toast('Пароль змінено'); } catch (e) { toast(e.message, true); }
};
$('#btn-out').onclick = logout;

/* ===== дані ===== */
const st = { tab: 'wait', q: '', offset: 0, items: [], more: false };
const SEL = 'select=*,review_photos(id,url,thumb_url,orig_url,created_at),review_contacts(phone)';
function filterQs() {
  let f = st.tab === 'wait' ? '&approved=eq.false' : st.tab === 'ok' ? '&approved=eq.true' : '';
  if (st.q) { const q = encodeURIComponent('*' + st.q.replace(/[(),*]/g, ' ') + '*'); f += `&or=(author_name.ilike.${q},body.ilike.${q},product_name.ilike.${q})`; }
  return f;
}
async function count(f) {
  const r = await api(`reviews?select=id${f}`, { method: 'HEAD', headers: { Prefer: 'count=exact', Range: '0-0' } });
  return +((r.headers.get('content-range') || '/0').split('/')[1]) || 0;
}
async function counts() {
  const [w, o, a] = await Promise.all([count('&approved=eq.false'), count('&approved=eq.true'), count('')]);
  $('#n-wait').textContent = w; $('#n-ok').textContent = o; $('#n-all').textContent = a;
}
async function load(reset) {
  if (reset) { st.offset = 0; st.items = []; $('#list').innerHTML = '<div class="empty">Завантаження…</div>'; }
  try {
    const r = await api(`reviews?${SEL}${filterQs()}&order=created_at.desc&limit=${PAGE + 1}&offset=${st.offset}`);
    const rows = await r.json();
    st.more = rows.length > PAGE;
    st.items = st.items.concat(rows.slice(0, PAGE));
    st.offset += PAGE;
    render();
  } catch (e) { $('#list').innerHTML = `<div class="empty">Не вдалося завантажити: ${esc(e.message)}</div>`; }
}

/* ===== картка відгуку ===== */
function localDT(iso) { const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); }
function phoneOf(r) { const c = r.review_contacts; return Array.isArray(c) ? (c[0] && c[0].phone) : (c && c.phone); }
function card(r) {
  const photos = (r.review_photos || []).sort((a, b) => a.created_at < b.created_at ? -1 : 1);
  const ph = phoneOf(r);
  const pname = r.product_name || 'Товар';
  return `<article class="card${r.approved ? '' : ' wait'}" data-id="${r.id}">
    <div class="c-head">
      <span class="pill ${r.approved ? 'ok' : 'wait'}">${r.approved ? 'Опубліковано' : 'На перевірці'}</span>
      ${r.product_url ? `<a class="prod" href="${esc(r.product_url)}" target="_blank" rel="noopener" title="Відкрити товар на сайті"><span>${esc(pname)}</span>${EXT}</a>` : `<span class="prod"><span>${esc(pname)}</span></span>`}
      ${r.product_uid ? `<span class="uid">ID ${esc(r.product_uid)}</span>` : ''}
    </div>
    <div class="c-grid">
      <div class="who">
        <label class="f">Ім'я<input class="in" data-f="author_name" value="${esc(r.author_name)}" maxlength="60"></label>
        <div class="f">Телефон ${ph ? `<div class="phone"><a href="tel:${esc(ph)}">${esc(ph)}</a><button data-copy="${esc(ph)}">копіювати</button></div>` : '<div class="phone none">Не вказано</div>'}</div>
        <div class="f">Оцінка<div class="stars" data-rating="${r.rating}">${[1, 2, 3, 4, 5].map(n => `<button data-r="${n}" class="${n <= r.rating ? 'on' : ''}" aria-label="${n} з 5">${STAR}</button>`).join('')}</div></div>
        <div class="row2">
          <label class="f">Дата<input class="in" type="datetime-local" data-f="created_at" value="${localDT(r.created_at)}"></label>
          <label class="f">Розмір<select class="in" data-f="size_fit"><option value="">—</option>${Object.keys(FIT).map(k => `<option value="${k}"${r.size_fit === k ? ' selected' : ''}>${FIT[k]}</option>`).join('')}</select></label>
        </div>
        <label class="chk"><input type="checkbox" data-f="verified"${r.verified ? ' checked' : ''}>Покупка підтверджена</label>
      </div>
      <div class="f" style="gap:10px">
        <label class="f">Текст відгуку<textarea class="ta" data-f="body" maxlength="1400">${esc(r.body)}</textarea></label>
        <div class="f">Фото${photos.length ? `<div class="photos">${photos.map(p => `<div class="ph"><img src="${esc(p.thumb_url || p.url)}" data-full="${esc(p.orig_url || p.url)}" loading="lazy" alt=""><button data-delphoto="${p.id}" title="Видалити фото">✕</button></div>`).join('')}</div>` : '<div class="nophoto">Без фото — опублікувати не можна</div>'}</div>
        <label class="f">Відповідь Moda24 <textarea class="ta reply" data-f="reply_text" maxlength="1000" placeholder="Напишіть відповідь — вона з'явиться під відгуком на сайті">${esc(r.reply_text || '')}</textarea></label>
      </div>
    </div>
    <div class="c-foot">
      <span class="meta">👍 ${r.helpful_up || 0} · 👎 ${r.helpful_down || 0}<span class="saved"> · Збережено</span></span>
      ${r.approved ? '<button class="btn" data-act="hide">Сховати з сайту</button>' : '<button class="btn dark" data-act="publish">Опублікувати</button>'}
      <button class="btn danger" data-act="delete">Видалити</button>
    </div>
  </article>`;
}
function render() {
  const el = $('#list');
  if (!st.items.length) { el.innerHTML = `<div class="empty">${st.q ? 'Нічого не знайдено' : st.tab === 'wait' ? 'Нових відгуків немає' : 'Відгуків немає'}</div>`; return; }
  el.innerHTML = st.items.map(card).join('') + (st.more ? '<button class="btn more" id="more">Показати ще</button>' : '');
}
const byId = id => st.items.find(x => x.id === id);
function savedMark(cardEl) { const s = cardEl.querySelector('.saved'); s.classList.add('on'); setTimeout(() => s.classList.remove('on'), 1500); }

/* збереження поля одразу після зміни */
async function saveField(cardEl, field, value) {
  const id = cardEl.dataset.id, r = byId(id), body = { [field]: value };
  if (field === 'reply_text') { body.reply_text = value.trim() || null; body.reply_date = body.reply_text ? (r.reply_date || new Date().toISOString()) : null; }
  if (field === 'body' && !value.trim()) { toast('Текст відгуку не може бути порожнім', true); return; }
  try { await patch(`reviews?id=eq.${id}`, body); Object.assign(r, body); savedMark(cardEl); }
  catch (e) { toast('Не збереглося: ' + e.message, true); }
}
document.addEventListener('change', e => {
  const t = e.target, c = t.closest('.card'); if (!c || !t.dataset.f) return;
  const f = t.dataset.f;
  if (f === 'verified') return saveField(c, f, t.checked);
  if (f === 'created_at') { if (!t.value) return; return saveField(c, f, new Date(t.value).toISOString()); }
  if (f === 'size_fit') return saveField(c, f, t.value || null);
  if (f === 'author_name') { const v = t.value.trim(); if (!v) { toast("Ім'я не може бути порожнім", true); return; } return saveField(c, f, v); }
  saveField(c, f, t.value);
});
document.addEventListener('click', async e => {
  const t = e.target;
  if (t.id === 'more') return load(false);
  const tab = t.closest('.tab');
  if (tab) { document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === tab)); st.tab = tab.dataset.tab; return load(true); }
  const img = t.closest('.ph img');
  if (img) { const lb = document.createElement('div'); lb.className = 'lb'; lb.innerHTML = `<img src="${esc(img.dataset.full)}" alt="">`; lb.onclick = () => lb.remove(); document.body.appendChild(lb); return; }
  const cp = t.closest('[data-copy]');
  if (cp) { navigator.clipboard && navigator.clipboard.writeText(cp.dataset.copy).then(() => toast('Номер скопійовано')); return; }
  const c = t.closest('.card'); if (!c) return;
  const id = c.dataset.id, r = byId(id);
  const star = t.closest('.stars button');
  if (star) {
    const n = +star.dataset.r;
    c.querySelectorAll('.stars button').forEach(b => b.classList.toggle('on', +b.dataset.r <= n));
    return saveField(c, 'rating', n);
  }
  const dp = t.closest('[data-delphoto]');
  if (dp) {
    if (!confirm('Видалити це фото?')) return;
    const p = r.review_photos.find(x => x.id === dp.dataset.delphoto);
    try {
      if (r.approved && r.review_photos.length === 1) throw new Error('Це останнє фото опублікованого відгуку. Спершу сховайте відгук з сайту.');
      await del(`review_photos?id=eq.${p.id}`);
      await removeFiles([p.url, p.thumb_url, p.orig_url]);
      r.review_photos = r.review_photos.filter(x => x.id !== p.id);
      c.outerHTML = card(r); toast('Фото видалено');
    } catch (err) { toast(err.message, true); }
    return;
  }
  const act = t.closest('[data-act]'); if (!act) return;
  try {
    if (act.dataset.act === 'publish') { await patch(`reviews?id=eq.${id}`, { approved: true }); r.approved = true; toast('Опубліковано — на сайті з\'явиться за хвилину'); }
    if (act.dataset.act === 'hide') { await patch(`reviews?id=eq.${id}`, { approved: false }); r.approved = false; toast('Відгук приховано з сайту'); }
    if (act.dataset.act === 'delete') {
      if (!confirm('Видалити відгук разом із фото? Відновити не можна.')) return;
      const files = (r.review_photos || []).flatMap(p => [p.url, p.thumb_url, p.orig_url]);
      await del(`reviews?id=eq.${id}`);   // фото, телефон і голоси видаляються разом із відгуком
      await removeFiles(files);
      st.items = st.items.filter(x => x.id !== id);
      toast('Відгук видалено');
    }
    // відгук переходить в іншу вкладку — прибираємо його з поточної
    if ((st.tab === 'wait' && r.approved) || (st.tab === 'ok' && !r.approved)) st.items = st.items.filter(x => x.id !== id);
    render(); counts();
  } catch (err) { toast(err.message, true); }
});
const storagePath = u => { const m = String(u || '').split(`/object/public/${BUCKET}/`)[1]; return m ? decodeURIComponent(m.split('?')[0]) : null; };
async function removeFiles(urls) {
  const prefixes = urls.map(storagePath).filter(Boolean);
  if (!prefixes.length) return;
  await fetch(`${SB_URL}/storage/v1/object/${BUCKET}`, { method: 'DELETE', headers: await H({ 'Content-Type': 'application/json' }), body: JSON.stringify({ prefixes }) }).catch(() => {});
}
let qt = null;
$('#q').oninput = () => { clearTimeout(qt); qt = setTimeout(() => { st.q = $('#q').value.trim(); load(true); }, 350); };

/* ===== старт ===== */
function start() { $('#login').hidden = true; $('#app').hidden = false; counts(); load(true); }
if (session && sessionStorage.getItem('adm_recovery') === '1') { $('#login').hidden = false; $('#lbox').hidden = true; $('#pbox').hidden = false; }
else if (session) isAdmin().then(ok => ok ? start() : logout()).catch(() => { $('#login').hidden = false; });
else $('#login').hidden = false;
</script>
</body>
