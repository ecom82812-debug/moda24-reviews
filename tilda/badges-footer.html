<!-- Moda24: плашки на картках товару (палітра 2 — приглушені кольори, правий кут). Стоїть у підвалі сайту і підвалі магазину. -->
<style>
html body #allrecords .mblok-badge.mblok-badge{padding:5px 7px 4px!important;border-radius:4px!important;font:700 10px/1 Manrope,Arial,sans-serif!important;letter-spacing:.06em!important;box-shadow:0 1px 2px rgba(30,26,27,.06)!important}
html body #allrecords .mblok-badge.mblok-badge--hit,html body #allrecords .mblok-badge.mblok-badge--vip,html body #allrecords .mblok-badge.mblok-badge--dark{background:#1E1A1B!important;color:#fff!important}
html body #allrecords .mblok-badge.mblok-badge--new{background:#4F7A57!important;color:#fff!important}
html body #allrecords .mblok-badge.mblok-badge--sale,html body #allrecords .mblok-badge.mblok-badge--disc{background:#B5303F!important;color:#fff!important}
html body #allrecords .mblok-badge.mblok-badge--out{background:#8E2433!important;color:#fff!important}
@media (min-width:961px){html body #allrecords .mblok-badge.mblok-badge{font-size:11px!important;padding:6px 9px 5px!important}}
</style>
<script>
/* РОЗПРОДАЖ — темніший за ЗНИЖКУ (у скрипті плашок обидві мають тип sale) */
(function(){function f(){document.querySelectorAll('.mblok-badge--sale:not(.mblok-badge--out)').forEach(function(b){if(b.textContent.trim()==='РОЗПРОДАЖ')b.classList.add('mblok-badge--out')})}
f();if('MutationObserver' in window)new MutationObserver(function(){requestAnimationFrame(f)}).observe(document.documentElement,{childList:true,subtree:true})})();
</script>
